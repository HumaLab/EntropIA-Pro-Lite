<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Caso: redactar un texto académico</title><desc id="desc">Crear un manuscrito, consultar texto del corpus, incorporar una cita y su referencia, revisar el borrador y descargarlo.</desc><rect width="1200" height="330" rx="24" fill="#f4f6f3"/><text x="48" y="56" fill="#14253a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Redactar un texto académico</text><g font-family="system-ui,sans-serif"><rect x="48" y="112" width="225" height="142" rx="16" fill="#e1eee8" stroke="#9bbdaf" stroke-width="2"/><text x="72" y="155" fill="#173e3a" font-size="17" font-weight="700">1 · Crear</text><text x="72" y="190" fill="#526174" font-size="14">Nuevo documento</text><text x="72" y="214" fill="#526174" font-size="14">en Escritura</text><path d="M280 182h36m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="324" y="112" width="225" height="142" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/><text x="348" y="155" fill="#23394b" font-size="17" font-weight="700">2 · Consultar</text><text x="348" y="190" fill="#526174" font-size="14">Buscar una fuente</text><text x="348" y="214" fill="#526174" font-size="14">en el panel Corpus</text><path d="M556 182h36m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="112" width="225" height="142" rx="16" fill="#f1ead9" stroke="#d9c99e" stroke-width="2"/><text x="624" y="155" fill="#4e4024" font-size="17" font-weight="700">3 · Citar</text><text x="624" y="190" fill="#665b43" font-size="14">Insertar pasaje</text><text x="624" y="214" fill="#665b43" font-size="14">y referencia</text><path d="M832 182h36m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="876" y="112" width="225" height="142" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/><text x="900" y="155" fill="#23394b" font-size="17" font-weight="700">4 · Revisar</text><text x="900" y="190" fill="#526174" font-size="14">Verificar fuentes</text><text x="900" y="214" fill="#526174" font-size="14">y exportar</text></g><text x="48" y="292" fill="#64717b" font-family="system-ui,sans-serif" font-size="14">La cita no reemplaza la revisión académica: comprobá autoría, página y formato requerido.</text></svg>