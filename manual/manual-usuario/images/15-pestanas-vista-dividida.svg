<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Pestañas y vista dividida</title>
  <desc id="desc">Esquema de hasta cuatro pestañas, el botón de vista dividida y dos áreas de trabajo separadas por una división móvil. No es una captura literal.</desc>
  <rect width="1200" height="520" rx="24" fill="#f6f1e7"/>
  <text x="48" y="58" fill="#1c2421" font-family="Palatino Linotype, Palatino, serif" font-size="28" font-weight="700">Pestañas y vista dividida</text>
  <text x="48" y="88" fill="#5c675f" font-family="Segoe UI, sans-serif" font-size="15">Cada pestaña conserva su recorrido. La división no mezcla las dos pantallas.</text>
  <rect x="48" y="116" width="1104" height="78" rx="12" fill="#1f4d43"/>
  <rect x="72" y="136" width="168" height="38" rx="8" fill="#f6f1e7"/>
  <text x="156" y="160" text-anchor="middle" fill="#1c2421" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Inicio</text>
  <rect x="248" y="136" width="188" height="38" rx="8" fill="#8a3e12"/>
  <text x="342" y="160" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Colección activa</text>
  <rect x="444" y="136" width="34" height="38" rx="8" fill="#164237"/>
  <text x="461" y="161" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">+</text>
  <text x="496" y="160" fill="#f6f1e7" font-family="Segoe UI, sans-serif" font-size="14">Hasta 4 pestañas</text>
  <rect x="860" y="136" width="168" height="38" rx="8" fill="#f3e2d4"/>
  <text x="944" y="160" text-anchor="middle" fill="#8a3e12" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Vista dividida</text>
  <rect x="48" y="220" width="520" height="236" rx="14" fill="#fffefa" stroke="#c8bba6" stroke-width="2"/>
  <text x="72" y="256" fill="#1f4d43" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Panel izquierdo</text>
  <text x="72" y="292" fill="#5c675f" font-family="Segoe UI, sans-serif" font-size="15">Su propia ruta y su propio volver.</text>
  <rect x="72" y="320" width="220" height="86" rx="10" fill="#e7efe9"/>
  <text x="92" y="358" fill="#1c2421" font-family="Segoe UI, sans-serif" font-size="14">Documento</text>
  <text x="92" y="382" fill="#5c675f" font-family="Segoe UI, sans-serif" font-size="13">visor y texto</text>
  <rect x="592" y="220" width="16" height="236" rx="8" fill="#8a3e12"/>
  <text x="600" y="478" text-anchor="middle" fill="#5c675f" font-family="Segoe UI, sans-serif" font-size="13">División</text>
  <rect x="632" y="220" width="520" height="236" rx="14" fill="#fffefa" stroke="#c8bba6" stroke-width="2"/>
  <text x="656" y="256" fill="#1f4d43" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Panel derecho</text>
  <text x="656" y="292" fill="#5c675f" font-family="Segoe UI, sans-serif" font-size="15">Otra pestaña, sin cambiar la izquierda.</text>
  <rect x="656" y="320" width="250" height="86" rx="10" fill="#f3e2d4"/>
  <text x="676" y="358" fill="#1c2421" font-family="Segoe UI, sans-serif" font-size="14">Explorador</text>
  <text x="676" y="382" fill="#5c675f" font-family="Segoe UI, sans-serif" font-size="13">se abre encima, no al lado</text>
</svg>
