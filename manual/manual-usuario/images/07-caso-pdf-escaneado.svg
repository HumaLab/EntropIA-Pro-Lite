<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Caso: buscar dentro de un PDF escaneado</title><desc id="desc">Importar el PDF, abrir una página, obtener texto con OCR, revisarlo contra la imagen y buscar una palabra.</desc><rect width="1200" height="330" rx="24" fill="#f4f6f3"/><text x="48" y="56" fill="#14253a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">PDF escaneado: del papel a la búsqueda</text><g font-family="system-ui,sans-serif"><rect x="48" y="112" width="225" height="142" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/><text x="72" y="155" fill="#23394b" font-size="17" font-weight="700">1 · Importar</text><text x="72" y="190" fill="#526174" font-size="14">Agregar el PDF</text><text x="72" y="214" fill="#526174" font-size="14">a una colección</text><path d="M280 182h36m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="324" y="112" width="225" height="142" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/><text x="348" y="155" fill="#23394b" font-size="17" font-weight="700">2 · Abrir</text><text x="348" y="190" fill="#526174" font-size="14">Elegir documento</text><text x="348" y="214" fill="#526174" font-size="14">y página</text><path d="M556 182h36m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="112" width="225" height="142" rx="16" fill="#f1ead9" stroke="#d9c99e" stroke-width="2"/><text x="624" y="155" fill="#4e4024" font-size="17" font-weight="700">3 · Obtener texto</text><text x="624" y="190" fill="#665b43" font-size="14">Ejecutar OCR</text><text x="624" y="214" fill="#665b43" font-size="14">con proveedor remoto</text><path d="M832 182h36m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="876" y="112" width="225" height="142" rx="16" fill="#e1eee8" stroke="#9bbdaf" stroke-width="2"/><text x="900" y="155" fill="#173e3a" font-size="17" font-weight="700">4 · Revisar y buscar</text><text x="900" y="190" fill="#526174" font-size="14">Corregir errores;</text><text x="900" y="214" fill="#526174" font-size="14">buscar una palabra</text></g><text x="48" y="292" fill="#64717b" font-family="system-ui,sans-serif" font-size="14">Verificá cada coincidencia en la imagen original. El texto leído puede contener errores.</text></svg>