<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Inicio rápido: del documento a la búsqueda</title>
  <desc id="desc">Cinco pasos: preparar la colección, importar el archivo, abrirlo, obtener y revisar el texto, y buscar una palabra.</desc>
  <rect width="1200" height="390" rx="24" fill="#f4f6f3"/>
  <text x="48" y="58" fill="#14253a" font-family="system-ui,sans-serif" font-size="27" font-weight="700">Del archivo a la primera búsqueda</text>
  <text x="48" y="88" fill="#64717b" font-family="system-ui,sans-serif" font-size="15">Un recorrido de usuario. En EntropIA Lite, OCR y asistencia de IA requieren conexión y proveedor configurado.</text>
  <g font-family="system-ui,sans-serif">
    <rect x="48" y="137" width="190" height="150" rx="16" fill="#e1eee8" stroke="#9bbdaf" stroke-width="2"/>
    <circle cx="77" cy="166" r="17" fill="#2d8270"/><text x="77" y="172" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
    <text x="70" y="215" fill="#173e3a" font-size="18" font-weight="700">Colección</text>
    <text x="70" y="247" fill="#526174" font-size="14">Crear o elegir</text>
    <text x="70" y="269" fill="#526174" font-size="14">un espacio de trabajo.</text>
    <path d="M246 212h32m-12-10 12 10-12 10" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="286" y="137" width="190" height="150" rx="16" fill="#e1eee8" stroke="#9bbdaf" stroke-width="2"/>
    <circle cx="315" cy="166" r="17" fill="#2d8270"/><text x="315" y="172" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
    <text x="308" y="215" fill="#173e3a" font-size="18" font-weight="700">Importar</text>
    <text x="308" y="247" fill="#526174" font-size="14">Elegir un PDF,</text>
    <text x="308" y="269" fill="#526174" font-size="14">imagen o audio.</text>
    <path d="M484 212h32m-12-10 12 10-12 10" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="524" y="137" width="190" height="150" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/>
    <circle cx="553" cy="166" r="17" fill="#526d82"/><text x="553" y="172" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
    <text x="546" y="215" fill="#23394b" font-size="18" font-weight="700">Abrir</text>
    <text x="546" y="247" fill="#526174" font-size="14">Seleccionar el</text>
    <text x="546" y="269" fill="#526174" font-size="14">documento importado.</text>
    <path d="M722 212h32m-12-10 12 10-12 10" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="762" y="137" width="190" height="150" rx="16" fill="#f1ead9" stroke="#d9c99e" stroke-width="2"/>
    <circle cx="791" cy="166" r="17" fill="#bd8c35"/><text x="791" y="172" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">4</text>
    <text x="784" y="215" fill="#4e4024" font-size="18" font-weight="700">Texto</text>
    <text x="784" y="247" fill="#665b43" font-size="14">Extraer y revisar</text>
    <text x="784" y="269" fill="#665b43" font-size="14">si es necesario.</text>
    <path d="M960 212h32m-12-10 12 10-12 10" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1000" y="137" width="152" height="150" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/>
    <circle cx="1029" cy="166" r="17" fill="#526d82"/><text x="1029" y="172" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">5</text>
    <text x="1022" y="215" fill="#23394b" font-size="18" font-weight="700">Buscar</text>
    <text x="1022" y="247" fill="#526174" font-size="14">Localizar una</text>
    <text x="1022" y="269" fill="#526174" font-size="14">palabra o frase.</text>
  </g>
  <text x="48" y="340" fill="#64717b" font-family="system-ui,sans-serif" font-size="14">Resultado esperado: encontrás el documento de origen y podés volver a comprobar el pasaje.</text>
</svg>
