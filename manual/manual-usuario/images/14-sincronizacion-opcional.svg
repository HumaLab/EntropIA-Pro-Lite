<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Sincronización opcional entre dispositivos</title><desc id="desc">Decidir si se sincroniza, iniciar sesión con una cuenta, configurar la sincronización automática si se desea, sincronizar y revisar el estado o los conflictos.</desc><rect width="1200" height="330" rx="24" fill="#f4f6f3"/><text x="48" y="56" fill="#14253a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Sincronizar solo si lo necesitás</text><g font-family="system-ui,sans-serif"><rect x="48" y="112" width="245" height="142" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/><text x="72" y="155" fill="#23394b" font-size="17" font-weight="700">1 · Decidir</text><text x="72" y="190" fill="#526174" font-size="14">Es opcional; para un</text><text x="72" y="214" fill="#526174" font-size="14">solo equipo, podés omitirla</text><path d="M300 182h24m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="334" y="112" width="245" height="142" rx="16" fill="#f1ead9" stroke="#d9c99e" stroke-width="2"/><text x="358" y="155" fill="#4e4024" font-size="17" font-weight="700">2 · Iniciar sesión</text><text x="358" y="190" fill="#665b43" font-size="14">Usar una cuenta de</text><text x="358" y="214" fill="#665b43" font-size="14">sincronización</text><path d="M586 182h24m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="112" width="245" height="142" rx="16" fill="#e1eee8" stroke="#9bbdaf" stroke-width="2"/><text x="644" y="155" fill="#173e3a" font-size="17" font-weight="700">3 · Configurar</text><text x="644" y="190" fill="#526174" font-size="14">Elegir si se sincroniza</text><text x="644" y="214" fill="#526174" font-size="14">automáticamente</text><path d="M872 182h24m-12-11 12 11-12 11" fill="none" stroke="#718389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="906" y="112" width="245" height="142" rx="16" fill="#e8edf2" stroke="#b1c0cb" stroke-width="2"/><text x="930" y="155" fill="#23394b" font-size="17" font-weight="700">4 · Revisar</text><text x="930" y="190" fill="#526174" font-size="14">Sincronizar y atender</text><text x="930" y="214" fill="#526174" font-size="14">estados o conflictos</text></g><text x="48" y="292" fill="#64717b" font-family="system-ui,sans-serif" font-size="14">EntropIA Lite usa el servicio incluido; no hay URL editable. Sincronizar no equivale a crear una copia de seguridad.</text></svg>