[package]
name = "internet-archive"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Internet Archive client (search, metadata, PDF availability) behind a strict fetch policy."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
lopdf = "0.45"
sha2 = "0.10"
md-5 = "0.10"
tokio = { version = "1", features = ["net", "rt", "macros", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
