[package]
name = "entropia-agent-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "stdio↔loopback connector shipped with EntropIA: finds the running app, reads the client token from the OS keyring and relays JSON-RPC to its local MCP endpoint."

[dependencies]
dirs = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
# HMAC-SHA256 for the D12 instance proof, built on the digest line the app also
# uses; there is no HMAC crate on either side.
sha2 = "0.11"
# The D12 challenge comes from the OS generator. 0.2 is the version this crate's
# Cargo.lock already pins (through reqwest's dependencies); `getrandom::getrandom`
# is the 0.2 entry point.
getrandom = "0.2"

# The token lives in the same OS credential store the app wrote it to, so the
# backend has to match the app's per-platform choice exactly.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
