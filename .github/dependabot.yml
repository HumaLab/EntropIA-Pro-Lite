# Dependency updates (audit finding C-03). One weekly run per ecosystem; minor
# and patch bumps arrive grouped in a single PR so they stay reviewable, major
# bumps keep their own PR. github-actions also keeps the SHA-pinned `uses:`
# lines current (Phase 7.3).
version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace root: package.json + pnpm-lock.yaml cover every package.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tiptap packages share one ProseMirror core and must move together, majors
      # included; a single extension on a different major breaks the editor.
      tiptap:
        patterns:
          - '@tiptap/*'
          - tiptap-footnotes
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ort is pinned to an exact release candidate and its `ndarray` feature fixes
    # the ndarray version; each rc changes the tensor API used by the local ML
    # code. Upgrade both together, by hand, as one migration.
    ignore:
      - dependency-name: ort
      - dependency-name: ndarray
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
