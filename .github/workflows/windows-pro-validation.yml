name: Windows Pro validation

# Isolated artifact-only validation for the Windows Pro (local-ml) installers.
# Triggered ONLY by pushes to feat/internet-archive or
# feat/runtime-auto-bootstrap that touch this workflow file;
# documentation-only pushes do not retrigger the ~35-60 min MNN build.
# Never creates a GitHub release: artifacts only.
on:
  push:
    branches:
      - feat/internet-archive
      - feat/runtime-auto-bootstrap
    paths:
      - .github/workflows/windows-pro-validation.yml

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.4
  # Same signed bootstrap source as the release pipeline. build.rs requires a baked
  # download source for release builds that ship the fixture runtime-pack.
  ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL: https://github.com/HumaLab/EntropIA-Pro/releases/download/runtime-bootstrap/manifest.json
  ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_ID: entropia-runtime-2026
  ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_BASE64: fSt35Xo0XtpdZUH/Q2gsPm1drMZczLMQNcU6fqAEbi0=

jobs:
  build-windows-pro:
    name: Build Windows Pro (NSIS + MSI)
    runs-on: windows-latest
    # Cold MNN compilation from source can take 35-60 minutes.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.90.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Restore canonical lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: npm exec --package=pnpm@${{ env.PNPM_VERSION }} -- pnpm install --frozen-lockfile

      # Plain `pnpm exec tauri build` from apps/desktop: the release-creating
      # Tauri GitHub Action is deliberately avoided so no token, tag, or
      # release parameter can ever attach this run to a release.
      # The Windows resource overlay (hooks.nsh, WebView2 repair hook, VC
      # runtime staging, Pro resources) applies via tauri.windows.conf.json.
      # bash, not the default pwsh: the WebView2 repair hook runs under Windows
      # PowerShell 5.1, and a pwsh parent leaks PowerShell 7 module paths into
      # PSModulePath, which breaks loading Get-AuthenticodeSignature.
      - name: Build Pro installers (NSIS + MSI)
        shell: bash
        working-directory: apps/desktop
        env:
          VITE_LOCAL_ML: '1'
          ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL: ${{ env.ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL }}
          ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_ID: ${{ env.ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_ID }}
          ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_BASE64: ${{ env.ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_BASE64 }}
        run: pnpm exec tauri build --features local-ml --bundles nsis,msi --config src-tauri/tauri.windows.conf.json

      # Explicit presence guard for BOTH installer types: the upload step
      # below must never succeed with only one of them.
      - name: Guard NSIS + MSI presence
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "No NSIS installer found under apps/desktop/src-tauri/target/release/bundle/nsis" }
          $msi = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "No MSI installer found under apps/desktop/src-tauri/target/release/bundle/msi" }
          Write-Host "NSIS installer: $($nsis.FullName) ($($nsis.Length) bytes)"
          Write-Host "MSI installer:  $($msi.FullName) ($($msi.Length) bytes)"

      - name: Upload Windows Pro installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pro-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
