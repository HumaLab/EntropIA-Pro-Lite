name: Lite preview (macOS + Linux)

# Builds EntropIA Lite installers for macOS (.app/.dmg, universal) and Ubuntu
# (.deb) and smoke-tests them. Artifacts only: this workflow never creates a
# tag, a release, or touches the Store flow. release.yml calls it on tag pushes
# and attaches the .deb and .dmg only once every smoke test has passed; a
# manual dispatch builds the same artifacts for a preview.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lite-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.4
  MACOSX_DEPLOYMENT_TARGET: '10.15'
  CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
  # Lite frontend.
  VITE_LOCAL_ML: '0'

jobs:
  build-macos:
    name: Build Lite macOS (universal)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: lite-universal

      - name: Restore canonical lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: npm exec --package=pnpm@${{ env.PNPM_VERSION }} -- pnpm install --frozen-lockfile

      # Pinned Pdfium (universal), shipped in Contents/Frameworks by tauri.lite.macos.conf.json.
      - name: Fetch Pdfium (mac-univ)
        run: bash apps/desktop/scripts/fetch-pdfium.sh mac-univ

      # Lite = no Cargo features + VITE_LOCAL_ML=0 + tauri.lite.conf.json, plus the
      # macOS Lite overlay (Pdfium). There is no Apple certificate: identity "-" asks
      # the bundler for an ad-hoc signature, which Apple Silicon requires to run the
      # arm64 slice at all. Not notarized.
      - name: Build Lite (.app + .dmg, universal)
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm exec tauri build --config src-tauri/tauri.lite.conf.json --config src-tauri/tauri.lite.macos.conf.json --target universal-apple-darwin --bundles app,dmg

      - name: Stage macOS artifacts
        run: |
          set -euo pipefail
          BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          ls -la "$BUNDLE"/macos "$BUNDLE"/dmg
          OUT="$RUNNER_TEMP/lite-macos"
          mkdir -p "$OUT"
          cp "$BUNDLE"/dmg/*.dmg "$OUT/"
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/EntropIA-Lite-universal.app.zip"
          ls -la "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-macos-dmg
          path: ${{ runner.temp }}/lite-macos/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-macos-app-zip
          path: ${{ runner.temp }}/lite-macos/*.app.zip
          if-no-files-found: error

  smoke-macos:
    name: Smoke Lite macOS (${{ matrix.label }})
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-14
          - label: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/lite-preview

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lite-macos-dmg
          path: dmg

      - name: Mount, launch, assert alive, screenshot
        run: bash .github/lite-preview/smoke-macos.sh "$(ls dmg/*.dmg | head -n 1)" "$RUNNER_TEMP/smoke"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lite-macos-smoke-${{ matrix.label }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn

  # The Pdfium lookup (src/ocr/pdf.rs) branches per OS, and the pinned library
  # must work with pdfium-render; neither can run on Windows. Lean (Lite) build.
  rust-unix-tests:
    name: Rust Pdfium tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            pdfium: mac-univ
            lib: libpdfium.dylib
          - os: ubuntu-22.04
            pdfium: linux-x64
            lib: libpdfium.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: lite-unix-tests

      - name: Fetch Pdfium (${{ matrix.pdfium }})
        run: bash apps/desktop/scripts/fetch-pdfium.sh ${{ matrix.pdfium }}

      - name: cargo test pdfium (lean)
        working-directory: apps/desktop/src-tauri
        env:
          ENTROPIA_PDFIUM_PROBE_LIB: ${{ github.workspace }}/apps/desktop/src-tauri/resources/pdfium/${{ matrix.lib }}
        run: cargo test --lib pdfium -- --nocapture --test-threads=1

  build-linux:
    name: Build Lite Linux (.deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: lite-linux

      - name: Restore canonical lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: npm exec --package=pnpm@${{ env.PNPM_VERSION }} -- pnpm install --frozen-lockfile

      # Pinned Pdfium, shipped under resources/pdfium by tauri.lite.linux.conf.json,
      # whose resource list is only this plus the license and provider files.
      - name: Fetch Pdfium (linux-x64)
        run: bash apps/desktop/scripts/fetch-pdfium.sh linux-x64

      # Tauri merges tauri.linux.conf.json automatically on Linux, so this yields
      # base + linux + lite + the Linux Lite overlay (its own package/binary
      # identity, entropia-lite, and Pdfium).
      - name: Build Lite (.deb)
        working-directory: apps/desktop
        run: pnpm exec tauri build --config src-tauri/tauri.lite.conf.json --config src-tauri/tauri.lite.linux.conf.json --bundles deb

      - name: Stage .deb
        run: |
          set -euo pipefail
          DEB="$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | head -n 1)"
          mkdir -p "$RUNNER_TEMP/lite-linux"
          cp "$DEB" "$RUNNER_TEMP/lite-linux/"
          dpkg-deb -I "$DEB"
          CONTENTS="$(dpkg-deb -c "$DEB")"
          printf '%s\n' "$CONTENTS"
          # E-01: Lite ships Pdfium and none of the Pro or Windows payload.
          if ! grep -qE '/resources/pdfium/libpdfium\.so$' <<<"$CONTENTS"; then
            echo "::error::Lite .deb does not contain resources/pdfium/libpdfium.so"
            exit 1
          fi
          if grep -E '/(models|runtime-pack|tools/uv)/|\.py$|\.dll$' <<<"$CONTENTS"; then
            echo "::error::Lite .deb ships Pro or Windows payload (entries listed above)"
            exit 1
          fi
          ls -la "$RUNNER_TEMP/lite-linux"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-linux-deb
          path: ${{ runner.temp }}/lite-linux/*.deb
          if-no-files-found: error

  smoke-linux:
    name: Smoke Lite Linux (${{ matrix.image }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/lite-preview

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lite-linux-deb
          path: deb

      - name: apt install, launch under Xvfb, assert alive, screenshot
        run: bash .github/lite-preview/smoke-linux.sh "$(ls deb/*.deb | head -n 1)" "$GITHUB_WORKSPACE/smoke-out"

      - name: Smoke artifact name
        if: always()
        id: name
        run: echo "suffix=$(echo '${{ matrix.image }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lite-linux-smoke-${{ steps.name.outputs.suffix }}
          path: smoke-out/
          if-no-files-found: warn
