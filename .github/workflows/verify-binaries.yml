name: Verify Binaries

# Keeps the committed-binary manifest honest (audit finding D-07). Every
# git-tracked binary must be listed and hashed; upstream entries must still be
# byte-identical to their pinned release archive. The weekly schedule catches a
# moved or withdrawn upstream release even when no PR touches these paths.

on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/binary-provenance.json
      - apps/desktop/scripts/verify-binaries.mjs
      - apps/desktop/src-tauri/resources/**
      - apps/desktop/src-tauri/msix/**
      - artifacts/**
      - .github/workflows/verify-binaries.yml
      # A binary added anywhere else must also trigger the coverage check.
      - '**/*.exe'
      - '**/*.dll'
      - '**/*.so'
      - '**/*.dylib'
      - '**/*.mnn'
      - '**/*.onnx'
      - '**/*.msix'
      - '**/*.zip'
      - '**/*.tgz'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-binaries:
    name: Verify binary provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check manifest and tracked binaries (offline)
        run: node apps/desktop/scripts/verify-binaries.mjs check

      - name: Verify upstream archives
        run: node apps/desktop/scripts/verify-binaries.mjs verify-upstream
