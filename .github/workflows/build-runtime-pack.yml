name: Build Runtime Pack

# Builds a FRESH runtime-pack (Windows or Linux x86_64) from scratch (managed Python env + warmed
# model caches + native libs) and uploads it as the `runtime-archive` artifact,
# which Publish Runtime Bootstrap (publish-runtime-bootstrap.yml) consumes via
# runtime_pack_run_id to host the split parts + signed manifest on the
# `runtime-bootstrap` tag. Release (release.yml) never consumes runtime payloads:
# it builds the lean installer with the bootstrap source baked in.
#
# Dependency specs mirror src/deps/registry.rs.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Runtime platform to build'
        required: true
        default: 'windows-x86_64'
        type: choice
        options:
          - windows-x86_64
          - linux-x86_64
      app_version:
        description: 'App version to stamp into the pack manifest'
        required: true
        default: '0.1.1'
        type: string
      pack_version:
        description: 'Pack version (YYYY.MM.patch)'
        required: true
        default: '2026.05.0'
        type: string
      native_source_release_tag:
        description: 'Release tag whose Windows installer provides onnxruntime.dll'
        required: true
        default: 'runtime-source-0.1.0'
        type: string

jobs:
  build:
    name: Build Windows runtime pack
    if: inputs.platform == 'windows-x86_64'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MANAGED_ROOT: ${{ github.workspace }}/.runtime-build/managed
      ENV_DIR: ${{ github.workspace }}/.runtime-build/managed/venv/entropia-env
      HF_CACHE: ${{ github.workspace }}/.runtime-build/caches/hf
      PADDLEX_CACHE: ${{ github.workspace }}/.runtime-build/caches/paddlex
      NATIVE_DIR: ${{ github.workspace }}/.runtime-build/native
      OUTPUT_DIR: ${{ github.workspace }}/.runtime-build/runtime-payloads
      ASSEMBLED_DIR: ${{ github.workspace }}/.runtime-build/assembled
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv
          uv --version

      - name: Create managed Python env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MANAGED_ROOT"
          uv venv --python 3.11 "$ENV_DIR"
          echo "MANAGED_PY=$ENV_DIR/Scripts/python.exe" >> "$GITHUB_ENV"

      - name: Install AI dependencies (registry.rs order)
        shell: bash
        run: |
          set -euo pipefail
          PY="$ENV_DIR/Scripts/python.exe"
          uv pip install --python "$PY" "paddlepaddle>=3.2.1,<3.3.0"
          uv pip install --python "$PY" "paddleocr[doc-parser]>=2.9.0"
          uv pip install --python "$PY" "faster-whisper>=1.0.0"
          uv pip install --python "$PY" "spacy>=3.8.0,<3.9.0" \
            "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl"

      - name: Warm up models (download weights into caches)
        shell: bash
        env:
          HF_HOME: ${{ github.workspace }}/.runtime-build/caches/hf
          HF_HUB_CACHE: ${{ github.workspace }}/.runtime-build/caches/hf
          PADDLE_PDX_CACHE_HOME: ${{ github.workspace }}/.runtime-build/caches/paddlex
        run: |
          set -euo pipefail
          mkdir -p "$HF_HUB_CACHE" "$PADDLE_PDX_CACHE_HOME"
          PY="$ENV_DIR/Scripts/python.exe"
          "$PY" -c "import paddle; print('paddle', paddle.__version__)"
          "$PY" -c "from paddleocr import PaddleOCRVL; PaddleOCRVL(); print('paddleocr-vl warmed')"
          "$PY" -c "from faster_whisper import WhisperModel; WhisperModel('base'); print('faster-whisper warmed')"
          "$PY" -c "import spacy; spacy.load('es_core_news_md'); print('spacy ok')"

      - name: Gather native libs (pdfium committed; onnxruntime from installer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_DIR"
          cp apps/desktop/src-tauri/resources/lib/pdfium.dll "$NATIVE_DIR/"
          INST="${{ github.workspace }}/.runtime-build/inst"
          mkdir -p "$INST"
          gh release download "${{ inputs.native_source_release_tag }}" \
            --pattern 'EntropIA.Pro_*_x64-setup.exe' --dir "$INST"
          7z x "$INST"/*.exe -o"$INST/x" -y >/dev/null
          ONNX="$(find "$INST/x" -name onnxruntime.dll | head -1)"
          if [ -z "$ONNX" ]; then echo "::error::onnxruntime.dll not found in installer"; exit 1; fi
          cp "$ONNX" "$NATIVE_DIR/"
          ls -la "$NATIVE_DIR"

      - name: Materialize runtime payload
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop/src-tauri/scripts/materialize_windows_runtime_payload.py \
            --managed-python "$ENV_DIR/Scripts/python.exe" \
            --uv-path "apps/desktop/src-tauri/resources/tools/uv/windows-x86_64/uv.exe" \
            --pack-version "${{ inputs.pack_version }}" \
            --app-version "${{ inputs.app_version }}" \
            --hf-cache-source "$HF_CACHE" \
            --paddlex-cache-source "$PADDLEX_CACHE" \
            --native-source-dir "$NATIVE_DIR" \
            --output-dir "$OUTPUT_DIR"

      - name: Assemble runtime pack (generate manifest.json)
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop/src-tauri/scripts/build_runtime_pack.py \
            --platform windows-x86_64 \
            --payload-root "$OUTPUT_DIR" \
            --output-dir "$ASSEMBLED_DIR" \
            --require-release-payload

      - name: Smoke test the assembled runtime pack
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop/src-tauri/scripts/runtime-pack-smoke.py \
            --platform windows-x86_64 --root "$ASSEMBLED_DIR" --release --install-probe

      - name: Archive assembled runtime pack + report size
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ github.workspace }}/.runtime-build/runtime-pack-windows-x86_64.zip"
          # Zip the assembled platform dir CONTENTS (manifest.json at archive root) using 7z (handles >2GB).
          ( cd "$ASSEMBLED_DIR/windows-x86_64" && 7z a -tzip -mx=3 "$ARCHIVE" "./*" >/dev/null )
          SIZE=$(stat -c%s "$ARCHIVE")
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          GB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1073741824}")
          echo "================ RUNTIME ARCHIVE ================"
          echo "archive_size_bytes=$SIZE"
          echo "archive_size_gb=$GB  (GitHub asset limit: 2 GiB = 2147483648 bytes)"
          echo "fits_single_github_asset=$([ "$SIZE" -le 2147483648 ] && echo YES || echo NO_NEEDS_SPLIT)"
          echo "archive_sha256=$SHA"
          echo "================================================"

      - name: Upload runtime archive (for hosting)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-archive
          path: ${{ github.workspace }}/.runtime-build/runtime-pack-windows-x86_64.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload runtime-payloads artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-payloads
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 7
          if-no-files-found: error

  # Linux mirror of the Windows job. The base interpreter is uv's managed
  # (python-build-standalone) CPython 3.11, which is relocatable, so copying its
  # prefix into python/ gives a pack that runs from any install directory.
  # onnxruntime comes from the venv's own onnxruntime wheel (pulled by
  # faster-whisper), and Pdfium from the same pinned release as the Lite bundles.
  build-linux:
    name: Build Linux runtime pack
    if: inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ENV_DIR: ${{ github.workspace }}/.runtime-build/managed/venv/entropia-env
      HF_CACHE: ${{ github.workspace }}/.runtime-build/caches/hf
      PADDLEX_CACHE: ${{ github.workspace }}/.runtime-build/caches/paddlex
      NATIVE_DIR: ${{ github.workspace }}/.runtime-build/native
      UV_LINUX_DIR: ${{ github.workspace }}/.runtime-build/uv-linux
      OUTPUT_DIR: ${{ github.workspace }}/.runtime-build/runtime-payloads
      ASSEMBLED_DIR: ${{ github.workspace }}/.runtime-build/assembled
      UV_RELEASE: '0.6.14'
      UV_LINUX_SHA256: 0aaf451c391d3913823bfb8ed354b446dcfd0553a32ed8266611e4181c61fd51
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The venv, the repacked wheelhouse, the assembled pack and its archive
      # each hold a few GB; the stock runner image keeps too little free.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "${{ github.workspace }}"

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade uv
          uv --version

      - name: Create managed Python env
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv venv --python 3.11 --python-preference only-managed "$ENV_DIR"
          "$ENV_DIR/bin/python" -c "import sys; print(sys.version); print(sys.base_prefix)"

      - name: Install AI dependencies (registry.rs order)
        shell: bash
        run: |
          set -euo pipefail
          PY="$ENV_DIR/bin/python"
          uv pip install --python "$PY" "paddlepaddle>=3.2.1,<3.3.0"
          uv pip install --python "$PY" "paddleocr[doc-parser]>=2.9.0"
          uv pip install --python "$PY" "faster-whisper>=1.0.0"
          uv pip install --python "$PY" "spacy>=3.8.0,<3.9.0" \
            "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl"

      - name: Warm up models (download weights into caches)
        shell: bash
        env:
          HF_HOME: ${{ github.workspace }}/.runtime-build/caches/hf
          HF_HUB_CACHE: ${{ github.workspace }}/.runtime-build/caches/hf
          PADDLE_PDX_CACHE_HOME: ${{ github.workspace }}/.runtime-build/caches/paddlex
        run: |
          set -euo pipefail
          mkdir -p "$HF_HUB_CACHE" "$PADDLE_PDX_CACHE_HOME"
          PY="$ENV_DIR/bin/python"
          "$PY" -c "import paddle; print('paddle', paddle.__version__)"
          "$PY" -c "from paddleocr import PaddleOCRVL; PaddleOCRVL(); print('paddleocr-vl warmed')"
          "$PY" -c "from faster_whisper import WhisperModel; WhisperModel('base'); print('faster-whisper warmed')"
          "$PY" -c "import spacy; spacy.load('es_core_news_md'); print('spacy ok')"

      - name: Gather native libs (pinned Pdfium; onnxruntime from the venv)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_DIR"
          bash apps/desktop/scripts/fetch-pdfium.sh linux-x64
          cp apps/desktop/src-tauri/resources/pdfium/libpdfium.so "$NATIVE_DIR/"
          ONNX="$(find "$ENV_DIR" -path '*/onnxruntime/capi/libonnxruntime.so*' -type f | sort | head -1)"
          if [ -z "$ONNX" ]; then echo "::error::libonnxruntime.so not found in the managed venv"; exit 1; fi
          cp "$ONNX" "$NATIVE_DIR/libonnxruntime.so"
          ls -la "$NATIVE_DIR"

      - name: Fetch pinned uv for Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$UV_LINUX_DIR"
          ASSET="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ASSET" \
            "https://github.com/astral-sh/uv/releases/download/${UV_RELEASE}/${ASSET}"
          echo "${UV_LINUX_SHA256}  $RUNNER_TEMP/$ASSET" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uv" "$UV_LINUX_DIR/uv"
          "$UV_LINUX_DIR/uv" --version

      - name: Materialize runtime payload
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/desktop/src-tauri/scripts/materialize_windows_runtime_payload.py \
            --platform linux-x86_64 \
            --managed-python "$ENV_DIR/bin/python" \
            --uv-path "$UV_LINUX_DIR/uv" \
            --pack-version "${{ inputs.pack_version }}" \
            --app-version "${{ inputs.app_version }}" \
            --hf-cache-source "$HF_CACHE" \
            --paddlex-cache-source "$PADDLEX_CACHE" \
            --native-source-dir "$NATIVE_DIR" \
            --output-dir "$OUTPUT_DIR"
          # The venv is fully repacked into the payload's wheelhouse by now.
          rm -rf "$ENV_DIR"
          df -h "${{ github.workspace }}"

      - name: Assemble runtime pack (generate manifest.json)
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/desktop/src-tauri/scripts/build_runtime_pack.py \
            --platform linux-x86_64 \
            --payload-root "$OUTPUT_DIR" \
            --output-dir "$ASSEMBLED_DIR" \
            --require-release-payload

      - name: Smoke test the assembled runtime pack
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/desktop/src-tauri/scripts/runtime-pack-smoke.py \
            --platform linux-x86_64 --root "$ASSEMBLED_DIR" --release --install-probe

      - name: Archive assembled runtime pack + report size
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ github.workspace }}/.runtime-build/runtime-pack-linux-x86_64.zip"
          # manifest.json at the archive root; 7z writes zip64 past 4 GiB. Execute
          # bits need not survive the zip: the app restores them from the manifest.
          ( cd "$ASSEMBLED_DIR/linux-x86_64" && 7z a -tzip -mx=3 "$ARCHIVE" "./*" >/dev/null )
          SIZE=$(stat -c%s "$ARCHIVE")
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          GB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1073741824}")
          echo "================ RUNTIME ARCHIVE ================"
          echo "archive_size_bytes=$SIZE"
          echo "archive_size_gb=$GB  (GitHub asset limit: 2 GiB = 2147483648 bytes)"
          echo "fits_single_github_asset=$([ "$SIZE" -le 2147483648 ] && echo YES || echo NO_NEEDS_SPLIT)"
          echo "archive_sha256=$SHA"
          echo "================================================"

      - name: Upload runtime archive (for hosting)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-archive-linux-x86_64
          path: ${{ github.workspace }}/.runtime-build/runtime-pack-linux-x86_64.zip
          retention-days: 7
          if-no-files-found: error
