name: Engine pin bump

# Moves the research engine pin in Cargo.lock to the tip of EntropIA-Agent's
# main and proposes it as a pull request once CI passed on that exact commit.
# The bot never pushes to main (audit finding D-05): a maintainer merges the PR.
# Pushes and PRs made with GITHUB_TOKEN never trigger workflows, so CI is
# dispatched explicitly (workflow_dispatch is the one event they can start);
# that run reports its checks on the same SHA the PR points at.
#
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings > Actions > General > Workflow permissions).

on:
  schedule:
    - cron: '0 9 * * *' # 06:00 in Argentina
  workflow_dispatch:

permissions:
  contents: write # push the bump branch (never main)
  pull-requests: write # open or update the bump PR
  actions: write # dispatch CI and follow its run

concurrency:
  group: engine-pin-bump
  cancel-in-progress: false

env:
  BUMP_BRANCH: bot/engine-pin-bump
  LOCK_PATH: apps/desktop/src-tauri/Cargo.lock

jobs:
  bump:
    name: Move the engine pin
    runs-on: ubuntu-latest
    # CI's cold Windows legs can take 90 minutes; waiting on them sets the ceiling.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Only a moved pin is a bump. cargo also re-wires ranged windows-sys
      # edges on every update, engine or not; that churn alone is discarded.
      # A lock that lost the GitHub pin makes engine_pin fail, which stops the run.
      - name: Update entropia-agent in Cargo.lock
        id: update
        shell: bash
        run: |
          engine_pin() {
            grep -oE 'EntropIA-Agent[^#"]*#[0-9a-f]{40}' "$LOCK_PATH" | grep -oE '[0-9a-f]{40}$'
          }
          before=$(engine_pin)
          cargo update -p entropia-agent --manifest-path apps/desktop/src-tauri/Cargo.toml
          after=$(engine_pin)
          if [ "$before" = "$after" ]; then
            git checkout -- "$LOCK_PATH"
            echo "The pin already matches the engine's main; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pin=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the bump on its own branch
        id: commit
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          PIN: ${{ steps.update.outputs.pin }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): move the research engine pin to ${PIN:0:7}" -- "$LOCK_PATH"
          git push --force origin "HEAD:refs/heads/$BUMP_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The bump is the branch's only commit on top of main, so CI's change
      # detection (HEAD~1 on a dispatched run) sees Cargo.lock and runs the
      # Rust and Pro legs.
      - name: Run CI on the bump
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$BUMP_BRANCH"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --branch "$BUMP_BRANCH" --event workflow_dispatch \
              --json databaseId,headSha --jq "map(select(.headSha == \"$BUMP_SHA\")) | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "CI never started for $BUMP_SHA"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 60

      # The tested bump becomes a PR. A run that finds one already open only
      # refreshes its title and body: the force-push above moved the PR's head,
      # and the CI run dispatched above already reported on that SHA.
      - name: Open or update the bump pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.update.outputs.pin }}
          BUMP_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          title="build(deps): move the research engine pin to ${PIN:0:7}"
          body=$(printf '%s\n\n%s\n' \
            "Automated bump of the EntropIA-Agent pin in Cargo.lock to \`$PIN\`." \
            "CI passed on $BUMP_SHA (dispatched by the Engine pin bump workflow). Merge to update main.")
          existing=$(gh pr list --head "$BUMP_BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated PR #$existing to $BUMP_SHA"
            exit 0
          fi
          gh pr create --base main --head "$BUMP_BRANCH" --title "$title" --body "$body"
