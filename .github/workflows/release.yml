name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_platform:
        description: 'Platforms to build from manual dispatch.'
        required: false
        default: 'windows'
        type: choice
        options:
          - windows
          - all
      lite_only:
        description: 'Test ONLY the EntropIA Lite MSIX (skip the Pro build + draft release).'
        required: false
        default: false
        type: boolean

env:
  PNPM_VERSION: 9.15.4
  MACOSX_DEPLOYMENT_TARGET: '10.15'
  CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
jobs:
  build:
    name: Build ${{ matrix.name }}
    # Skipped when dispatched with lite_only=true (focused EntropIA Lite MSIX test).
    if: ${{ inputs.lite_only != true }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Tag pushes build Windows only. Pro Linux stays out of the matrix until
        # a linux-x86_64 runtime pack is published and the fail-closed gate below
        # finds a matching manifest entry; Lite Linux still ships via lite-unix.
        # Default manual dispatch stays Windows-only; `all` adds macOS (no
        # runtime-pack, so the gate is skipped for it).
        include: ${{ fromJSON((github.event_name == 'push' && '[{"name":"windows-latest","platform":"windows-latest","build_args":"--features local-ml --bundles nsis,msi","rust_target":"","runtime_platform":"windows-x86_64"}]') || (inputs.release_platform != 'all' && '[{"name":"windows-latest","platform":"windows-latest","build_args":"--features local-ml --bundles nsis,msi","rust_target":"","runtime_platform":"windows-x86_64"}]') || '[{"name":"windows-latest","platform":"windows-latest","build_args":"--features local-ml --bundles nsis,msi","rust_target":"","runtime_platform":"windows-x86_64"},{"name":"macos-14 (arm64)","platform":"macos-14","build_args":"--features local-ml --target aarch64-apple-darwin","rust_target":"aarch64-apple-darwin","runtime_platform":""}]') }}
    runs-on: ${{ matrix.platform }}
    # LEAN INSTALLER: the ~2.2GB ML runtime is NOT bundled (it overruns the NSIS/WiX
    # 2 GiB bundler limits). The app ships the tiny runtime-pack fixture and downloads
    # the real runtime at first launch from this ed25519-signed source, published by
    # the Publish Runtime Bootstrap workflow. These three vars are read at COMPILE time
    # via option_env!() (settings.rs) and pinned by build.rs rerun-if-env-changed.
    # Pro-only: Lite has no `local-ml` feature, so build.rs skips the guard and its
    # installers must not bake a download source at all.
    # The URL is the one publish-runtime-bootstrap.yml prints for this repository
    # (C-02). Releases up to 1.0.20 baked the old repository name, HumaLab/EntropIA-Pro,
    # which GitHub redirects here; never create a repository with that name, or
    # those installs lose their runtime source.
    env:
      ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL: https://github.com/HumaLab/EntropIA-Pro-Lite/releases/download/runtime-bootstrap/manifest.json
      ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_ID: entropia-runtime-2026
      ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_BASE64: fSt35Xo0XtpdZUH/Q2gsPm1drMZczLMQNcU6fqAEbi0=
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # C-04: package.json is the single version source. Every derived declaration
      # must agree (and the `v*` tag must match the version) before the expensive
      # build starts.
      - name: Check version consistency
        shell: bash
        # The ref goes through env, never `${{ }}` inside run: (script injection).
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node apps/desktop/scripts/version.mjs check --tag "$REF_NAME"
          else
            node apps/desktop/scripts/version.mjs check
          fi

      # Fail-closed gate: the app resolves its bootstrap release with an EXACT
      # (app_version, platform) match in the signed manifest (runtime/bootstrap.rs
      # and runtime/manifest.rs select_release). If the manifest lacks this
      # release's pair, the Pro installer could never download its runtime on a
      # clean machine, so the workflow stops here instead of building it.
      - name: Require a published runtime for this Pro build
        if: matrix.runtime_platform != ''
        shell: bash
        run: node apps/desktop/scripts/check-runtime-bootstrap.mjs --platform ${{ matrix.runtime_platform }} --manifest-url "$ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0

      - name: Install Rust target (macOS cross-compilation)
        if: matrix.rust_target != ''
        run: |
          rustup target add ${{ matrix.rust_target }}

      - name: Restore canonical lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: npm exec --package=pnpm@${{ env.PNPM_VERSION }} -- pnpm install --frozen-lockfile

      # Pinned Pdfium, fetched into resources/pdfium and bundled by the
      # explicit tauri.pro.linux.conf.json overlay (E-02). It is not listed in
      # tauri.linux.conf.json: Tauri merges that file into every Linux build,
      # cargo test included, and fails on a missing resource. Kept for when the
      # Pro Linux leg returns to the matrix after a linux-x86_64 runtime pack is
      # published; Lite Linux is exercised by the lite-unix job meanwhile.
      - name: Fetch Pdfium (linux-x64)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash apps/desktop/scripts/fetch-pdfium.sh linux-x64

      # No runtime-pack injection: the committed fixture ships as-is so the app
      # detects "runtime not ready" and bootstraps it from the baked signed source.
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the Pro frontend to local-ml=on (today this is unset and defaults to '1'
          # via the vite define; made explicit so the Pro behavior is locked).
          VITE_LOCAL_ML: '1'
          ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL: ${{ env.ENTROPIA_RUNTIME_BOOTSTRAP_MANIFEST_URL }}
          ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_ID: ${{ env.ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_ID }}
          ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_BASE64: ${{ env.ENTROPIA_RUNTIME_BOOTSTRAP_PUBLIC_KEY_BASE64 }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EntropIA Pro & Lite ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download the EntropIA Pro and EntropIA Lite installers for your platform. EntropIA Pro downloads its local ML runtime automatically on first launch.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.build_args }}

  # EntropIA-Lite MS-Store MSIX leg. Builds the LEAN app (no local-ml) into an MSI,
  # then repacks the vendored base MSIX (apps/desktop/src-tauri/msix/EntropIALite-base.msix)
  # with the freshly built exe + exact Store identity. Output is an UNSIGNED, Store-ready
  # MSIX uploaded as a build artifact (NOT to the GitHub release — Pro owns the release).
  # This job is independent from `build`; the Pro NSIS -> release flow above is unchanged.
  build-lite:
    name: Build EntropIA Lite MSIX
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # C-04: package.json is the single version source. Fail before the build when
      # any derived declaration (or the pushed tag) disagrees, and expose the
      # 4-segment Store version that the MSIX repack and upload consume below.
      - name: Resolve version
        id: version
        shell: bash
        # The ref goes through env, never `${{ }}` inside run: (script injection).
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node apps/desktop/scripts/version.mjs check --tag "$REF_NAME"
          else
            node apps/desktop/scripts/version.mjs check
          fi
          echo "store_version=$(node apps/desktop/scripts/version.mjs print --store)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0

      - name: Restore canonical lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: npm exec --package=pnpm@${{ env.PNPM_VERSION }} -- pnpm install --frozen-lockfile

      # Build the lean MSI (local-ml compiled out by the default lean feature set).
      # Lite builds without `local-ml`, so build.rs skips guard_lean_bootstrap_source()
      # entirely and no runtime download source is baked into the installer.
      - name: Build lean Tauri installers (NSIS + MSI)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_LOCAL_ML: '0'
        with:
          # No release params: tauri-action only builds (does not create/touch a release).
          # The NSIS .exe + WiX .msi are the distributable Lite installers (attached to the
          # GitHub release by attach-lite-installers); the .msi also feeds the MSIX repack.
          # tauri-action runs from the repo root, so --config is root-relative
          # (unlike the local `apps/desktop`-relative `src-tauri/...`).
          # tauri.lite.windows.conf.json replaces the shared Windows resource list,
          # dropping what only local-ml reads (uv, models, runtime pack, scripts).
          args: --config apps/desktop/src-tauri/tauri.lite.conf.json --config apps/desktop/src-tauri/tauri.lite.windows.conf.json --bundles nsis,msi

      # Locate the built lean app exe (input to the MSIX repack) and the distributable
      # installers (NSIS .exe + WiX .msi) for the GitHub release. The Pro crate name is
      # entropia-pro-desktop, so the raw binary is entropia-pro-desktop.exe; the repack
      # renames it to entropia-lite-desktop.exe inside the MSIX payload.
      - name: Locate lean app exe + installers
        id: artifacts
        shell: pwsh
        run: |
          $releaseDir = "apps/desktop/src-tauri/target/release"
          # Raw app exe (direct child of target/release) — input to the MSIX repack.
          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch 'build-script|deps' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "No release app exe found under $releaseDir" }
          # Distributable installers (under bundle/) — uploaded to the GitHub release.
          $setup = Get-ChildItem -Path "$releaseDir/bundle/nsis" -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $msi = Get-ChildItem -Path "$releaseDir/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $setup) { throw "No NSIS installer found under $releaseDir/bundle/nsis" }
          if (-not $msi)   { throw "No MSI installer found under $releaseDir/bundle/msi" }
          "exe_path=$($exe.FullName)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "setup_path=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_path=$($msi.FullName)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "App exe (repack): $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "NSIS installer:   $($setup.FullName) ($($setup.Length) bytes)"
          Write-Host "MSI installer:    $($msi.FullName) ($($msi.Length) bytes)"

      # Stage the Lite installers and publish them as a build artifact. attach-lite-installers
      # uploads these to the GitHub release on tag pushes; the artifact also lets a `lite_only`
      # dispatch produce downloadable installers without touching a release.
      - name: Stage Lite installers
        shell: pwsh
        run: |
          $dst = "${{ runner.temp }}/lite-installers"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "${{ steps.artifacts.outputs.setup_path }}" $dst
          Copy-Item "${{ steps.artifacts.outputs.msi_path }}" $dst
          Get-ChildItem $dst | ForEach-Object { Write-Host "staged: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload Lite installers artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EntropIALite-installers
          path: ${{ runner.temp }}/lite-installers/*
          if-no-files-found: error

      - name: Repack Store MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ runner.temp }}/msix-out" -Force | Out-Null
          ./apps/desktop/src-tauri/scripts/repack-store-msix.ps1 `
            -BaseMsix "apps/desktop/src-tauri/msix/EntropIALite-base.msix" `
            -ExePath "${{ steps.artifacts.outputs.exe_path }}" `
            -PdfiumPath "apps/desktop/src-tauri/resources/lib/pdfium.dll" `
            -OutDir "${{ runner.temp }}/msix-out" `
            -StoreVersion "${{ steps.version.outputs.store_version }}"

      - name: Upload EntropIA Lite MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EntropIALite-msix
          path: ${{ runner.temp }}/msix-out/EntropIALite-Store-HLab-${{ steps.version.outputs.store_version }}.msix
          if-no-files-found: error

  # Attaches the EntropIA Lite installers (NSIS .exe + WiX .msi, built by build-lite) to
  # the GitHub release for the pushed tag, so Lite is downloadable from GitHub alongside
  # Pro (the MSIX remains the Microsoft Store channel). Runs ONLY on tag pushes — never on
  # the `lite_only` dispatch (that path just produces the EntropIALite-installers artifact).
  # Needs `build` (creates the draft release + owns Pro assets) and `build-lite` (produces
  # the installers artifact). To backfill an already-published release, download the same
  # EntropIALite-installers artifact and `gh release upload <tag> ...` manually.
  attach-lite-installers:
    name: Attach Lite installers to release
    needs: [build, build-lite]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Lite installers
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: EntropIALite-installers
          path: lite-installers

      - name: Upload installers to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" lite-installers/* --clobber --repo "${{ github.repository }}"

  # EntropIA Lite for macOS (universal .dmg) and Ubuntu (.deb), built and
  # smoke-tested by the same workflow used for previews. Tag pushes and `all`
  # dispatches only; the default Windows-only and `lite_only` dispatches skip it.
  lite-unix:
    name: Lite macOS + Linux
    if: ${{ github.event_name == 'push' || (inputs.release_platform == 'all' && inputs.lite_only != true) }}
    uses: ./.github/workflows/lite-preview.yml
    permissions:
      contents: read

  # Attaches the Lite .deb and .dmg to the tag's draft release. `needs` covers the
  # whole called workflow, smoke tests included: an installer that did not start
  # on a clean Ubuntu or macOS runner is never attached.
  attach-lite-unix:
    name: Attach Lite macOS + Linux installers to release
    needs: [build, lite-unix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Lite .deb
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: lite-linux-deb
          path: lite-unix

      - name: Download Lite .dmg
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: lite-macos-dmg
          path: lite-unix

      - name: Upload installers to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la lite-unix
          gh release upload "${{ github.ref_name }}" lite-unix/* --clobber --repo "${{ github.repository }}"
