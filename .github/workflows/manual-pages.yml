name: Manual Pages

# Builds the EntropIA Lite user manual (manual/) into the published site
# layout and deploys it to GitHub Pages. Source of truth for the manual's
# content and styling is manual/manual-usuario/build_html.py; see
# manual/manual-usuario/build_html.py --out _site for a local build.

on:
  push:
    branches: [main]
    paths:
      - 'manual/**'
      - '.github/workflows/manual-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manual site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install -r manual/manual-usuario/requirements.txt

      - name: Build site
        run: python manual/manual-usuario/build_html.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
