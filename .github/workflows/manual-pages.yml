name: Manual Pages

# Builds the EntropIA Lite user manual (manual/) into the published site
# layout and deploys it to GitHub Pages. Source of truth for the manual's
# content and styling is manual/manual-usuario/build_html.py; see
# manual/manual-usuario/build_html.py --out _site for a local build.

on:
  push:
    branches: [main]
    paths:
      - 'manual/**'
      - '.github/workflows/manual-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manual site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install -r manual/manual-usuario/requirements.txt

      - name: Build site
        run: python manual/manual-usuario/build_html.py --out _site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
