name: Manual Pages

# Builds the EntropIA Lite user manual (manual/) into the published site
# layout and deploys it to GitHub Pages. Source of truth for the manual's
# content and styling is manual/manual-usuario/build_html.py; see
# manual/manual-usuario/build_html.py --out _site for a local build.

on:
  push:
    branches: [main]
    paths:
      - 'manual/**'
      # The manual's header mark is read from the app's logo.
      - 'apps/desktop/src/assets/entropia-mark.png'
      - '.github/workflows/manual-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manual site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install -r manual/manual-usuario/requirements.txt

      - name: Build site
        run: python manual/manual-usuario/build_html.py --out _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
