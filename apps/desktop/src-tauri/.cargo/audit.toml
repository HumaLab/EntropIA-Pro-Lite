# cargo-audit configuration for the desktop crate (audit item D-08).
# Every ignored advisory states why it is accepted and when to drop it.
# cargo-audit reads this file from the working directory: run it from
# apps/desktop/src-tauri.
#
# Remaining warnings, deliberately NOT ignored so they stay visible. None has
# a fix we can pull in; each comes from a third-party crate (2026-10-10):
# - glib 0.18.5 (RUSTSEC-2024-0429, unsound) and proc-macro-error 1.0.4
#   (RUSTSEC-2024-0370, unmaintained, via glib-macros): Tauri's GTK3 /
#   webkit2gtk stack on Linux. The fix is glib >= 0.20, i.e. Tauri moving
#   off gtk-rs 0.18.
# - core2 0.4.0 (RUSTSEC-2026-0105, unmaintained and yanked): image's AVIF
#   support through bitstream-io.
# - paste 1.0.15 (RUSTSEC-2024-0436, unmaintained, proc-macro): hayagriva,
#   biblatex, rav1e, simba.
# - ttf-parser 0.25.1 (RUSTSEC-2026-0192, unmaintained): lopdf 0.42 (via
#   pdf-extract) and owned_ttf_parser (via imageproc).

[advisories]
ignore = [
    # quick-xml 0.38.4: quadratic run time when checking a start tag for
    # duplicate attribute names.
    "RUSTSEC-2026-0194",
    # quick-xml 0.38.4: unbounded namespace-declaration allocation in NsReader.
    "RUSTSEC-2026-0195",
    # Both reach us only through hayagriva 0.10.1 -> citationberg 0.7.0, the
    # latest published releases, which pin quick-xml ^0.38. citationberg parses
    # CSL XML: the bundled styles, and a custom .csl the writer picks, capped
    # at 2 MB (MAX_STYLE_BYTES, writing/csl/render.rs) and parsed on a
    # blocking thread. The worst case is that thread hanging or allocating
    # heavily on a malicious stylesheet the user loaded; no code execution.
    # Accepted 2026-10-10. Drop both lines when citationberg publishes a
    # release on quick-xml >= 0.41 (its main branch already uses 0.41).
]
