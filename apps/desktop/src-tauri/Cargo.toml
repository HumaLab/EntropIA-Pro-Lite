[package]
name = "entropia-pro-desktop"
version = "1.0.20"
edition = "2021"
rust-version = "1.90"
resolver = "3"

[lib]
name = "entropia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# The research engine. Cargo.lock pins the exact commit; `cargo update -p
# entropia-agent` moves it. To co-develop against the sibling checkout, add a
# `[patch."https://github.com/HumaLab/EntropIA-Agent"]` in .cargo/config.toml
# (gitignored). The patch rewrites Cargo.lock while it is active, so never
# commit the lock with it on; CI rejects a lock that lost the pinned commit.
entropia-agent = { git = "https://github.com/HumaLab/EntropIA-Agent", branch = "main" }
# In-memory quantized cosine scan of the bibliography passage search. A path
# crate so its hot loop can be optimized in debug builds (see the profile below).
vecscan = { path = "../../../crates/vecscan" }
tauri = { version = "2.12.1", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
fs2 = "0.4"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
thiserror = "1"
ocr-rs = { version = "2.2", optional = true, features = ["build-mnn-from-source"] }
pdf-extract = "0.7"
lopdf = "0.45"
pdfium-render = "0.8"
image = "0.25"
imageproc = "0.25"
png = "0.18"
tokio = { version = "1", features = ["full"] }
regex = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
ndarray = { version = "=0.16.1", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"], optional = true }
tokenizers = { version = "0.15", default-features = false, features = ["onig"], optional = true }
encoding_rs = "0.8"
# Already compiled for tauri-utils and wry (same 0.28 since tauri 2.12); declared here so the
# HTML snapshot extractor can use it directly. No new crate enters the build.
dom_query = "0.28"
llama-cpp-2 = { version = "0.1", optional = true }
# CSL rendering (plan-editor.md §27.3). MIT OR Apache-2.0 — which is why it is
# here and citeproc-js is not: that one is CPAL-1.0 OR AGPL-1.0, reached even
# through the MIT-labelled @citation-js/plugin-csl. Spike S3 verified it covers
# clusters, locators, style switching and cited-only bibliographies, and reads
# Zotero's CSL-JSON with no conversion layer. `archive` bundles the CSL styles
# so a fresh install can render without downloading anything.
hayagriva = { version = "0.10.1", features = ["archive", "csl-json"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls", "rustls-tls-native-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
urlencoding = "2"
httpdate = "1"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", optional = true }
# Audio preview decoding (prepare_audio_preview command): decode arbitrary
# source audio to a PCM16 WAV the webview <audio> element can play.
symphonia = { version = "0.5", features = ["all"] }
hound = "3"
# Embeddings use a bundled local ONNX model via Rust ort. Transcription still
# uses Python subprocess (scripts/transcribe.py) for faster-whisper isolation.

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# Cloud-sync stores session tokens in the OS secret service (DESIGN §6.x).
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Cloud-sync stores session tokens in the macOS Keychain. settings.rs and
# sync/session.rs use keyring on every platform, so each target needs a backend.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
# Cloud-sync stores session tokens in the Windows credential manager.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Lite asks Microsoft Store for updates of its own package (store_updates.rs).
# Same 0.62 line Tauri/wry now resolve (was 0.61 with tauri 2.11); only the
# features that module uses.
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Services_Store",
    "Win32_Foundation",
    "Win32_UI_Shell",
] }
# Awaiting the Store operation needs its `IntoFuture`, which only this crate's
# `std` feature provides (`windows` depends on it without default features).
windows-future = "0.3"
# The Navegador closes a sign-in popup when its page calls `window.close()`:
# wry only destroys the popup's inner container window, so the app subscribes
# to WebView2's `WindowCloseRequested` itself (viewer.rs). Pinned to the version
# Tauri/wry already resolve (0.39.1 with wry 0.57); adds no new crate to the tree.
webview2-com = "=0.39.1"

[dev-dependencies]
# Test-only: lets the sync MockSyncApi build a `reqwest::Response` from raw bytes
# for blob-download tests (transitively present via reqwest 0.12).
http = "1"
# Test-only: `tauri::test` drives the real IPC entry point (`Webview::on_message`)
# with the real capabilities, which is how tests/app_acl.rs proves the ACL holds.
tauri = { version = "2.12.1", features = ["test"] }

# Local performance measurement only — never ships. Mirrors the release
# optimization level so numbers mean something, while still inheriting `dev` so
# PROFILE stays "debug" and the lean-bootstrap guard in build.rs is not
# circumvented. It differs from release in one way worth stating: no LTO.
[profile.measure]
inherits = "dev"
opt-level = "s"
debug = false
debug-assertions = false
overflow-checks = false

# `tauri dev` runs an unoptimized build, where scanning ~100k vectors takes
# many seconds. Only this tiny, non-generic crate is optimized; the rest of the
# dev build keeps its fast incremental compiles.
[profile.dev.package.vecscan]
opt-level = 3

[profile.release.package.vecscan]
opt-level = 3

[profile.release]
# Unwinding, not abort: third-party parsers (pdf-extract) panic on unusual
# files and the code contains those panics with `catch_unwind` (see
# `ocr::pdf::extract_pdf_text` and the scheduler's executor guard). Under
# `abort` every one of those would kill the whole app instead.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
# The default build is the lean/API-only baseline used by EntropIA Lite. Local
# inference is opt-in: Pro builds must explicitly enable `local-ml`.
#
# local-ml bundles every local-inference capability: local OCR (MNN/PaddleOCR via
# the paddle-ocr sub-feature), local embeddings + LLM (ort / llama.cpp), and the
# signed managed-runtime download (ed25519 / zip).
default = []
local-ml = [
    "paddle-ocr",
    "dep:ort",
    "dep:ndarray",
    "dep:tokenizers",
    "dep:llama-cpp-2",
    "dep:ed25519-dalek",
    "dep:zip",
]
# The paddle-ocr feature requires MNN to be built from source on Windows
# (prebuilt MNN libs have a linker issue: __std_min_4i/__std_max_4i unresolved).
# The build-mnn-from-source flag in the ocr-rs dependency ensures MNN compiles
# locally via CMake, which resolves the linker symbols correctly.
paddle-ocr = ["dep:ocr-rs"]
# The embedded browser is a child webview, which Tauri gates behind `unstable`.
# Off by default: the commands still exist (so the ACL manifest is the same in
# every build) but answer "unavailable". See src/navegador/viewer.rs.
navegador = ["tauri/unstable"]

# tao 0.35.3 deadlocks the UI thread on Windows while typing (PeekMessageW
# re-enters the window proc with a non-reentrant mutex held). Backport of
# tauri-apps/tao#1215. Drop with the Tauri upgrade; see vendor/tao/PATCHED.md.
[patch.crates-io]
tao = { path = "vendor/tao" }
